<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITRI Fleet Console — 登入</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚚</text></svg>">
<style>
  :root {
    --bg: #0a0e13; --panel: #121922; --line: #22303f;
    --fg: #e6edf5; --dim: #8697aa; --accent: #38bdf8; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
    background-image: radial-gradient(circle at 50% 0%, #14202e 0%, #0a0e13 60%);
  }
  .box {
    width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .logo {
    font-weight: 800; font-size: 30px; letter-spacing: 3px;
    color: var(--accent); text-align: center;
  }
  .sub {
    text-align: center; color: var(--dim); font-size: 12px;
    letter-spacing: .6px; margin: 4px 0 26px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; background: #0b1119; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 13px; font-size: 15px; letter-spacing: 2px;
  }
  input[type=password]:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 16px; padding: 11px;
    background: var(--accent); color: #06212e; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .msg {
    display: none; margin-bottom: 16px; padding: 9px 12px; border-radius: 7px;
    background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35);
    color: var(--bad); font-size: 12.5px;
  }
  .msg.show { display: block; }
  .foot { margin-top: 22px; text-align: center; color: #5a6b7d; font-size: 11px; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="logo">ITRI</div>
    <div class="sub">FLEET CONSOLE</div>

    <div class="<!--MSGCLASS-->"><!--MESSAGE--></div>

    <label for="password">存取密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus required>
    <input type="hidden" name="next" value="<!--NEXT-->">
    <button type="submit">進入儀表板</button>

    <div class="foot">此頁面經由 Tailscale Funnel 對外公開</div>
  </form>
</body>
</html>
